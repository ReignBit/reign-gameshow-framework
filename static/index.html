<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby - Player</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/host.css">
  <script src="/static/js/messages.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/player.js"></script>
  
  <style>
    body { padding-top: 50px; }
    #messages { max-height: 400px; overflow-y: auto; }
    #messages li { padding: 0.25rem 0; }
  </style>
</head>
<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card mb-3">
          <div class="card-body text-center">
            <h1 class="card-title">Lobby</h1>

            <form id="join-game-form" class="d-flex gap-2 justify-content-center mb-3" onsubmit="joinMessage(event)">
              <input type="text" id="name" class="form-control" placeholder="Enter your name" autocomplete="off"/>
              <button class="btn btn-primary">Join</button>
            </form>
          </div>
        </div>

      </div>
    </div>

    <!-- Chat panel -->
    <div class="col-md-4 d-flex flex-column">
      <h4>Players</h4>
        <div class="card flex-grow-1 mb-2 p-2 d-flex flex-column" id="playerBox">
            <!-- Messages appended here -->
        </div>
        <h4>Chat</h4>
        <div class="card flex-grow-1 mb-2 p-2 d-flex flex-column" id="chatBox">
            <!-- Messages appended here -->
        </div>

        <form  id="send-msg-form" class="input-group mt-auto" onsubmit="sendMessage(event)">
            <input disabled type="text" id="messageText" class="form-control" placeholder="Type a message"
                autocomplete="off" />
            <button type="submit" class="btn btn-success">Send</button>
        </form>
    </div>
  </div>

  <script>
    var ws;
    var ishost = 0;
    var playerName;



    function joinMessage(event) {
      event.preventDefault();
      document.getElementById("messageText").disabled = false;
      document.getElementById("join-game-form").hidden = true;

      playerName = document.getElementById("name").value;
      connectWs();
    }
  </script>

  <!-- Bootstrap JS Bundle (optional, for modals etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
