<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamemaster</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="/static/js/messages.js"></script>
  <script src="/static/js/common.js"></script>
  <script defer src="/static/js/gamemaster.js"></script>

  <style>
    body { padding-top: 50px; }
    #messages { max-height: 400px; overflow-y: auto; }
    #messages li { padding: 0.25rem 0; }
  </style>
</head>
<body class="bg-light">

  <header class="bg-dark text-white text-center py-3 mb-3">
    <h2 class="mb-0"> Gamemaster Panel</h2>
  </header>


  <div class="container-fluid">
    <div class="row" style="min-height: 60vh;">
      

      <div class="col-md-8 border-end">
        
        <!-- Question list -->
        <div>
          <h4>Questions</h4>
          <button onclick="refreshQuestionList()">Refresh</button>
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newQuestionModal">
            Add New Question
          </button>
        </div>

        <ul class="list-group mb-3" id="questionList" style="max-height: 600px;">
          <!-- Populated from refreshQuestionList() -->
        </ul>

        <!-- Host actions -->
        <h5>Host Actions</h5>
        <div class="d-grid gap-2">
          <button class="btn-primary">Timer 30s</button>
          <button class="btn-primary">Next</button>
          <button class="btn-primary">Pause / Stop</button>
        </div>
      </div>

        <div class="col-md-4 d-flex flex-column">
          <h4>Chat</h4>
          <ul class="flex-grow-1 border rounded bg-white p-2 mb-2 overflow-auto" id="chatBox" style="min-height: 300px;">
            <!-- Chat boxes added from ws.onmessage -->
          </ul>
          <form id="send-msg-form" class="input-group" onsubmit="sendMessage(event)">
            <input type="text" id="messageText" class="form-control" placeholder="Type a message" autocomplete="off"/>
            <button type="submit" class="btn btn-success">Send</button>
          </form>
        </div>



    </div>
  </div>

  <!-- Show/Edit Question Modal -->
  <div class="modal fade" id="questionModal" tabindex="-1" aria-labelledby="questionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="questionModalLabel">Question Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <p><strong>Title:</strong> <span id="modalTitle"></span></p>
          <p><strong>Answers:</strong></p>
          <ul id="modalAnswers"></ul>
          <p><strong>Correct Answer:</strong> <span id="modalCorrect"></span></p>
          <p><strong>Factoid:</strong> <span id="modalFactoid"></span></p>
        </div>

        <div class="modal-footer">
          <button id="editQuestionBtn" class="btn btn-primary">Edit</button>
          <button id="deleteQuestionBtn" class="btn btn-danger">Delete</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>


  <!-- New Question Modal -->
  <div class="modal fade" id="newQuestionModal" tabindex="-1" aria-labelledby="newQuestionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        
        <div class="modal-header">
          <h5 class="modal-title" id="newQuestionModalLabel">New Question</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body">
          <form id="newQuestionForm" onsubmit="sendNewQuestionData(); return false;">
            <input type="hidden" name="question_id" id="question_id">
            <!-- Question Title -->
            <input type="text" name="nq-title" class="form-control mb-3" placeholder="Question Title"/>

            <!-- Answers -->
            <div class="d-flex flex-column gap-2">

              <div class="d-flex align-items-start p-2 border rounded gap-2">
                <input type="radio" name="correct-answer" value="0" class="form-check-input mt-1" style="width: 1.2em; height: 1.2em;">
                <input type="text" name="nq-a" class="form-control" placeholder="Answer A"/>
              </div>

              <div class="d-flex align-items-start p-2 border rounded gap-2">
                <input type="radio" name="correct-answer" value="1" class="form-check-input mt-1" style="width: 1.2em; height: 1.2em;">
                <input type="text" name="nq-b" class="form-control" placeholder="Answer B"/>
              </div>

              <div class="d-flex align-items-start p-2 border rounded gap-2">
                <input type="radio" name="correct-answer" value="2" class="form-check-input mt-1" style="width: 1.2em; height: 1.2em;">
                <input type="text" name="nq-c" class="form-control" placeholder="Answer C"/>
              </div>

              <div class="d-flex align-items-start p-2 border rounded gap-2">
                <input type="radio" name="correct-answer" value="3" class="form-check-input mt-1" style="width: 1.2em; height: 1.2em;">
                <input type="text" name="nq-d" class="form-control" placeholder="Answer D"/>
              </div>

            </div>

            <!-- Factoid -->
            <textarea name="factoid" rows="3" class="form-control mt-3" placeholder="Factoid shown after question"></textarea>

            <!-- Modal Footer -->
            <div class="modal-footer mt-3">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-success">Send</button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>



  <script>
    var ws;
    var ishost = 1;

    connectWs();

    function sendMessage(event) {
      event.preventDefault();
      var input = document.getElementById("messageText");
      ws.send(msg_text(input.value));
      input.value = '';
    }

    ws.onopen = () => ws.send(msg_host_join());

    ws.onmessage = function(event) {
      const messages = document.getElementById('chatBox');
      const message = document.createElement('li');
      messages.appendChild(message);
      message.className = 'list-group-item';
      
      data = JSON.parse(event.data);
      console.log(data)
      if (data.cmd == "text") {
        const name = document.createElement('strong');
        message.appendChild(name);
        name.textContent = data.from + ": ";

        const text = document.createTextNode(data.data);
        message.appendChild(text);
      } else {
        message.textContent = event.data;
      }

      
      
      messages.scrollTop = messages.scrollHeight;

      if (event.data.cmd === "reject") {
        ws.close();
        alert(event.data.reason);
      }
    };
  </script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
