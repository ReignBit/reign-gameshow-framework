<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamemaster Panel</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/host.css">
    <script src="/static/js/messages.js"></script>
    <script src="/static/js/common.js"></script>
    <script defer src="/static/js/gamemaster.js"></script>
</head>

<body>

    <header class="bg-dark text-white text-center py-3 mb-3">
        <h2 class="mb-0">Gamemaster Panel</h2>
    </header>

    <div class="container-fluid">
        <div class="row g-3">

            <!-- Question list and host actions -->
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4>Questions</h4>
                    <div class="btn-group">
                        <button onclick="refreshQuestionList()"
                            class="btn btn-outline-secondary btn-sm">Refresh</button>
                        <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal"
                            data-bs-target="#newQuestionModal">
                            Add New
                        </button>
                    </div>
                </div>

                <ul class="list-group mb-3" id="questionList">
                    <!-- Populated by JS -->
                    <span class=" text-center text-bg-secondary">Press 'Refresh' to fetch Questions</span>
                </ul>

                <h5>Host Actions</h5>
                <div class="d-flex gap-2 flex-wrap mb-3">
                    <button class="btn btn-primary flex-fill">Timer 30s</button>
                    <button class="btn btn-primary flex-fill">Next</button>
                    <button class="btn btn-danger flex-fill">Pause / Stop</button>
                </div>
            </div>

            <!-- Chat panel -->
            <div class="col-md-4 d-flex flex-column">
                <h4>Chat</h4>
                <div class="card flex-grow-1 mb-2 p-2 d-flex flex-column" id="chatBox">
                    <!-- Messages appended here -->
                </div>

                <form id="send-msg-form" class="input-group mt-auto" onsubmit="sendMessage(event)">
                    <input type="text" id="messageText" class="form-control" placeholder="Type a message"
                        autocomplete="off" />
                    <button type="submit" class="btn btn-success">Send</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Question Details Modal -->
    <div class="modal fade" id="questionModal" tabindex="-1" aria-labelledby="questionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="questionModalLabel">Question Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p><strong>Title:</strong> <span id="modalTitle"></span></p>
                    <p><strong>Answers:</strong></p>
                    <ul id="modalAnswers" class="answers-list"></ul>
                    <p><strong>Correct Answer:</strong> <span id="modalCorrect"></span></p>
                    <p><strong>Factoid:</strong> <span id="modalFactoid"></span></p>
                </div>

                <div class="modal-footer">
                    <button id="editQuestionBtn" class="btn btn-primary">Edit</button>
                    <button id="deleteQuestionBtn" class="btn btn-danger">Delete</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>

    <!-- New/Edit Question Modal -->
    <div class="modal fade" id="newQuestionModal" tabindex="-1" aria-labelledby="newQuestionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="newQuestionModalLabel">New Question</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="newQuestionForm" onsubmit="sendNewQuestionData(); return false;">
                        <input type="hidden" name="question_id" id="question_id">

                        <input type="text" name="nq-title" class="form-control mb-3" placeholder="Question Title" />

                        <div class="d-flex flex-column gap-2">
                            <div class="d-flex align-items-start p-2 border rounded gap-2 answer-group">
                                <input type="radio" name="correct-answer" value="0" class="form-check-input mt-1">
                                <input type="text" name="nq-a" class="form-control" placeholder="Answer A" />
                            </div>
                            <div class="d-flex align-items-start p-2 border rounded gap-2 answer-group">
                                <input type="radio" name="correct-answer" value="1" class="form-check-input mt-1">
                                <input type="text" name="nq-b" class="form-control" placeholder="Answer B" />
                            </div>
                            <div class="d-flex align-items-start p-2 border rounded gap-2 answer-group">
                                <input type="radio" name="correct-answer" value="2" class="form-check-input mt-1">
                                <input type="text" name="nq-c" class="form-control" placeholder="Answer C" />
                            </div>
                            <div class="d-flex align-items-start p-2 border rounded gap-2 answer-group">
                                <input type="radio" name="correct-answer" value="3" class="form-check-input mt-1">
                                <input type="text" name="nq-d" class="form-control" placeholder="Answer D" />
                            </div>
                        </div>

                        <textarea name="factoid" rows="3" class="form-control mt-3"
                            placeholder="Factoid shown after question"></textarea>

                        <div class="modal-footer mt-3">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-success">Send</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Example placeholder WebSocket & chat

        function openQuestionModal(q) {
            document.getElementById("modalTitle").textContent = q.title;
            document.getElementById("modalAnswers").innerHTML = `
        <li>A: ${q.ans_a}</li>
        <li>B: ${q.ans_b}</li>
        <li>C: ${q.ans_c}</li>
        <li>D: ${q.ans_d}</li>`;
            document.getElementById("modalCorrect").textContent = ["A", "B", "C", "D"][q.correct_ans];
            document.getElementById("modalFactoid").textContent = q.factoid;
            const modal = new bootstrap.Modal(document.getElementById('questionModal'));
            modal.show();
        }

        
    </script>

</body>

</html>
